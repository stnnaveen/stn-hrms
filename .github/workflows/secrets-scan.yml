# Every push: scan the whole history for leaked keys, tokens and passwords (gitleaks). Fails the run if anything is found.
name: Secret scan
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml
