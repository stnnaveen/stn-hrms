# Load test against the live project: N temporary test staff check in within S seconds, then check out in a burst.
# Run by hand only (Actions > Load test > Run workflow). Creates and deletes its own test accounts and data.
name: Load test
on:
  workflow_dispatch:
    inputs:
      users: { description: 'Test staff', default: '120' }
      seconds: { description: 'Check-in window (s)', default: '60' }
      burst: { description: 'Check-out burst window (s)', default: '10' }
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Clean project ref
        run: |
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]"' | sed -E 's#^https?://##; s#\.supabase\.co.*$##')
          test "${#ref}" -eq 20
          echo "REF=$ref" >> "$GITHUB_ENV"
          echo "SUPA_URL=https://$ref.supabase.co" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }   # pinned: "latest" hits GitHub rate limits
      - name: Fetch project keys (masked)
        run: |
          keys=$(supabase projects api-keys --project-ref "$REF" -o json)
          anon=$(echo "$keys" | jq -r '.[] | select(.name=="anon") | .api_key')
          svc=$(echo "$keys" | jq -r '.[] | select(.name=="service_role") | .api_key')
          test -n "$anon" && test -n "$svc"
          echo "::add-mask::$anon"; echo "::add-mask::$svc"
          echo "ANON=$anon" >> "$GITHUB_ENV"; echo "SERVICE=$svc" >> "$GITHUB_ENV"
      - name: Run load test
        working-directory: tools/loadtest
        env:
          N: ${{ inputs.users }}
          SECONDS: ${{ inputs.seconds }}
          BURST: ${{ inputs.burst }}
        run: node run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: loadtest-result, path: tools/loadtest/loadtest-result.json, if-no-files-found: ignore }
