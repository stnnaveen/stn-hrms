# Deploys the web app to Vercel on every push to main.
# Works with any Vercel account: it uses a Vercel token, not Vercel's GitHub link.
# Secret needed (Settings > Secrets and variables > Actions): VERCEL_TOKEN
name: Web deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: web-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Secret VERCEL_TOKEN is set
        run: test -n "$VERCEL_TOKEN"
      - name: Type-check and build
        run: npm ci && npm run build
      - name: Link Vercel project stn-hrms
        run: npx --yes vercel@latest link --yes --project stn-hrms --token "$VERCEL_TOKEN"
      - name: Deploy to production
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
