# Diagnostics (run by hand): read-only checks against the live project.
name: Diagnostics
on:
  workflow_dispatch:
    inputs:
      link: { description: 'Map link to test', default: '' }
      resolve: { description: 'Links to send to the live server (space separated)', default: '' }
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Clean project ref
        run: |
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]"' | sed -E 's#^https?://##; s#\.supabase\.co.*$##')
          echo "REF=$ref" >> "$GITHUB_ENV"; echo "SUPA_URL=https://$ref.supabase.co" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }   # pinned: "latest" hits GitHub rate limits
      - name: Fetch key (masked)
        run: |
          keys=$(supabase projects api-keys --project-ref "$REF" -o json)
          svc=$(echo "$keys" | jq -r '.[] | select(.name=="service_role") | .api_key'); anon=$(echo "$keys" | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "::add-mask::$svc"; echo "::add-mask::$anon"; echo "SERVICE=$svc" >> "$GITHUB_ENV"; echo "ANON=$anon" >> "$GITHUB_ENV"
      - name: Map link failures (server log)
        run: node tools/diag/venuelogs.mjs
      - name: Selfies today
        run: node tools/diag/selfies.mjs
      - name: Pins near the server city
        run: node tools/diag/badpins.mjs
      - name: Map links
        run: node tools/diag/maplinks.mjs
      - name: One link
        if: ${{ inputs.link != '' }}
        env: { LINK: '${{ inputs.link }}' }
        run: node tools/diag/linktest.mjs
      - name: Live server answers
        if: ${{ inputs.resolve != '' }}
        env: { LINKS: '${{ inputs.resolve }}' }
        run: node tools/diag/resolve.mjs
