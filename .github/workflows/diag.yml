# Diagnostics (run by hand): read-only checks against the live project.
name: Diagnostics
on:
  workflow_dispatch:
    inputs:
      link: { description: 'Map link to test', default: '' }
      testcode: { description: 'Set test staff code (8 digits)', default: '' }
      resolve: { description: 'Links to send to the live server (space separated)', default: '' }
      biotest: { description: 'Run the live eSSL link test (yes)', default: '' }
      bio: { description: 'Show live eSSL data and matches (yes)', default: '' }
      biofix: { description: 'One-off: fix the 047/069 eSSL match (yes)', default: '' }
      biotrace: { description: 'Trace fingerprint for names (comma separated)', default: '' }
      biocheck: { description: 'Verify HR fingerprint figures independently (yes)', default: '' }
      awscheck: { description: 'Check AWS selfie storage (yes)', default: '' }
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Clean project ref
        run: |
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]"' | sed -E 's#^https?://##; s#\.supabase\.co.*$##')
          echo "REF=$ref" >> "$GITHUB_ENV"; echo "SUPA_URL=https://$ref.supabase.co" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }   # pinned: "latest" hits GitHub rate limits
      - name: Fetch key (masked)
        run: |
          keys=$(supabase projects api-keys --project-ref "$REF" -o json)
          svc=$(echo "$keys" | jq -r '.[] | select(.name=="service_role") | .api_key'); anon=$(echo "$keys" | jq -r '.[] | select(.name=="anon") | .api_key')
          echo "::add-mask::$svc"; echo "::add-mask::$anon"; echo "SERVICE=$svc" >> "$GITHUB_ENV"; echo "ANON=$anon" >> "$GITHUB_ENV"
      - name: Google map search
        run: node tools/diag/gsearch.mjs
      - name: Which server secrets are set (names only)
        run: supabase secrets list --project-ref "$REF" | awk '{print "SECRET " $1}'
      - name: Map link failures (server log)
        run: node tools/diag/venuelogs.mjs
      - name: Security check (live)
        run: node tools/diag/security.mjs
        continue-on-error: true
      - name: eSSL link end-to-end (throw-away key, deleted after)
        if: ${{ inputs.biotest == 'yes' }}
        run: bash tools/diag/biotest.sh
      - name: eSSL one-off match fix
        if: ${{ inputs.biofix == 'yes' }}
        run: node tools/diag/biofix.mjs
      - name: AWS selfie storage
        if: ${{ inputs.awscheck == 'yes' }}
        run: node tools/diag/awscheck.mjs
      - name: eSSL independent verification
        if: ${{ inputs.biocheck == 'yes' }}
        run: node tools/diag/biocheck.mjs
      - name: eSSL trace people
        if: ${{ inputs.biotrace != '' }}
        env: { WHO: '${{ inputs.biotrace }}' }
        run: node tools/diag/biotrace.mjs
      - name: eSSL live data and matches
        if: ${{ inputs.bio == 'yes' }}
        run: node tools/diag/bio.mjs
      - name: Employee code shapes
        run: node tools/diag/codes.mjs
      - name: Disputes (7 days)
        run: node tools/diag/flags.mjs
      - name: Selfies today
        run: node tools/diag/selfies.mjs
      - name: Selfie links as HR
        run: node tools/diag/selfieview.mjs
      - name: Pins near the server city
        run: node tools/diag/badpins.mjs
      - name: Map links
        run: node tools/diag/maplinks.mjs
      - name: One link
        if: ${{ inputs.link != '' }}
        env: { LINK: '${{ inputs.link }}' }
        run: node tools/diag/linktest.mjs && node tools/diag/cidtest.mjs && FTID=0x3a526153743c13cb:0x4ee7f1df6abac44f node tools/diag/cid2.mjs
      - name: Live server answers
        if: ${{ inputs.resolve != '' }}
        env: { LINKS: '${{ inputs.resolve }}' }
        run: node tools/diag/resolve.mjs
      - name: Test staff code
        if: ${{ inputs.testcode != '' }}
        run: |
          echo "::add-mask::${{ inputs.testcode }}"
          CODE='${{ inputs.testcode }}' node tools/diag/testcode.mjs
