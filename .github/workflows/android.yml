# Store app (v2), Android: builds an installable APK of the current app for the pilot phones.
# Debug-signed for direct install; Play Store builds (signed .aab) come later from the same project.
name: Android app
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'capacitor.config.ts', 'package.json', 'package-lock.json', 'public/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Clean project ref
        run: |
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]"' | sed -E 's#^https?://##; s#\.supabase\.co.*$##')
          echo "REF=$ref" >> "$GITHUB_ENV"; echo "SUPA_URL=https://$ref.supabase.co" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with: { version: 2.121.0 }
      - name: Public app key (masked)
        run: |
          anon=$(supabase projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name=="anon") | .api_key')
          test -n "$anon"; echo "::add-mask::$anon"; echo "ANON=$anon" >> "$GITHUB_ENV"
      - name: Build web app
        run: |
          npm ci
          VITE_SUPABASE_URL="$SUPA_URL" VITE_SUPABASE_ANON_KEY="$ANON" npx vite build
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk "../out/StartupTN-HR-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: startuptn-hr-android, path: out/*.apk, retention-days: 30 }
  smoke:
    # opens the built APK on an Android emulator and saves screenshots + log, to prove it starts
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: startuptn-hr-android, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r out/*.apk
            adb shell pm grant in.startuptn.hr android.permission.ACCESS_FINE_LOCATION || true
            adb shell am start -n in.startuptn.hr/.MainActivity
            sleep 40
            adb exec-out screencap -p > shot-start.png
            adb shell input text 'naveenflop+staff@gmail.com' || true
            sleep 3
            adb exec-out screencap -p > shot-email.png
            adb logcat -d | grep -i -E "capacitor|chromium|console|AndroidRuntime|FATAL" | tail -120 > logcat.txt || true
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/ui.xml | grep -o 'text="[^"]*"' | grep -v 'text=""' | sed 's/^/SCREEN /' || true
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | sed 's/^/ACTIVITY /' || true
            grep -i -E "FATAL|Exception|Uncaught|error" logcat.txt | head -20 | sed 's/^/LOG /' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          retention-days: 14
          path: |
            shot-*.png
            logcat.txt
