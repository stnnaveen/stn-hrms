# Deploys the database and edge functions on every push to main.
# Secrets live in GitHub (Settings > Secrets and variables > Actions), never in code or chat:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
name: Supabase deploy
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Rule tests
        run: node --experimental-strip-types --no-warnings supabase/tests/rules.test.ts
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret SUPABASE_PROJECT_REF is set
        run: test -n "$PROJECT_REF"
      - name: Clean SUPABASE_PROJECT_REF (spaces, quotes, full URL)
        run: |
          ref=$(printf '%s' "$PROJECT_REF" | tr -d '[:space:]"' | sed -E 's#^https?://##; s#\.supabase\.co.*$##')
          test "${#ref}" -eq 20
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: Secret SUPABASE_ACCESS_TOKEN is set
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Secret SUPABASE_DB_PASSWORD is set
        run: test -n "$SUPABASE_DB_PASSWORD"
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Access token works
        run: supabase projects list > /dev/null
      - name: Token can see this project
        run: supabase projects list | grep -q "$PROJECT_REF"
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Push database
        run: supabase db push --include-all
      - name: Deploy check-in function
        run: supabase functions deploy check-in --project-ref "$PROJECT_REF"
